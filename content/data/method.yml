title: Problémamegoldási ciklus
center: Folyamatos visszacsatolás
return: Az ötödik lépés után újra az első következik.
steps:
  - name: Megérteni
    description: Mi a valódi probléma? Mi okozza, és milyen körülmények tartják fenn?
  - name: Egyszerűsíteni
    description: Melyek a szükségtelen függőségek, folyamatok és korlátozások? Mi a legkisebb értelmes változtatás?
  - name: Kipróbálni
    description: Ne tervezzünk a végtelenségig. Hozzunk létre egy ellenőrizhető, működő kísérletet.
  - name: Mérni
    description: Ne az elvégzett munkát mérjük, hanem azt, hogy jobb lett-e a működés.
  - name: Javítani
    description: A visszajelzések alapján módosítsuk a megoldást, vagy szükség esetén gondoljuk újra az eredeti feltételezéseket.
